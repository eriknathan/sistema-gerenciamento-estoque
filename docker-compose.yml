version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 core.wsgi:application"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgres://estoque_user:estoque_password@db:5432/estoque_db
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8089:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
